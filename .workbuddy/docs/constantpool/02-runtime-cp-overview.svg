  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">常量池站② · 运行时常量池解析全景（#12 从「名字」变成「真身」）</text>
  <text x="450" y="56" text-anchor="middle" font-size="12.5" fill="#6b7280">oops/constantPool.cpp · share/interpreter/interpreterRuntime.cpp · oops/cpCache.cpp · JDK 28</text>

