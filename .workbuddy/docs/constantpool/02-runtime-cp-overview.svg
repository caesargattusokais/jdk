  <text x="244" y="312" font-size="10" fill="#b45309">tag 已是 Klass</text>

  <rect x="36" y="320" width="270" height="76" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="171" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">快路径 · 直接读人</text>
  <text x="171" y="361" text-anchor="middle" font-size="10.5" fill="#92400e" font-family="Consolas,monospace">:645-649 tag.is_klass()</text>
  <text x="171" y="378" text-anchor="middle" font-size="10.5" fill="#92400e" font-family="Consolas,monospace">resolved_klasses()->at(idx)</text>
  <text x="171" y="392" text-anchor="middle" font-size="10" fill="#92400e" opacity="0.85">O(1) 无锁 · 数组直取</text>

