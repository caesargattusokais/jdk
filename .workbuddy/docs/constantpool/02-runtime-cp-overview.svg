  <text x="596" y="312" font-size="10" fill="#1d4ed8">还是 UnresolvedClass(100)</text>

  <rect x="594" y="320" width="270" height="76" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
