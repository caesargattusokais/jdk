  <text x="458" y="584" text-anchor="middle" font-size="10" fill="#6d28d9" font-family="Consolas,monospace">cpCache.cpp:79 三路写入</text>
  <text x="458" y="599" text-anchor="middle" font-size="9.5" fill="#6d28d9" opacity="0.9">direct :237 · vtable :244 · itable :251</text>

  <line x1="584" y1="575" x2="628" y2="575" stroke="#10b981" stroke-width="1.6" marker-end="url(#ar-green)"/>

  <rect x="628" y="544" width="236" height="62" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
