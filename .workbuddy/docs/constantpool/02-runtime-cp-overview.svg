  <text x="729" y="361" text-anchor="middle" font-size="10.5" fill="#1d4ed8" font-family="Consolas,monospace">:674 SystemDictionary::</text>
  <text x="729" y="378" text-anchor="middle" font-size="10.5" fill="#1d4ed8" font-family="Consolas,monospace">resolve_or_fail(name, loader)</text>
  <text x="729" y="392" text-anchor="middle" font-size="10" fill="#1d4ed8" opacity="0.85">查字典 · 未加载则触发加载</text>

  <!-- 慢路径 → 写回 -->
  <line x1="729" y1="396" x2="729" y2="416" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ar-blue)"/>
  <text x="741" y="411" font-size="9.5" fill="#1d4ed8">成功</text>

  <rect x="594" y="416" width="270" height="76" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="729" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">写回 + 发布</text>
  <text x="729" y="457" text-anchor="middle" font-size="10.5" fill="#1d4ed8" font-family="Consolas,monospace">:713 release_store → 数组</text>
  <text x="729" y="474" text-anchor="middle" font-size="10.5" fill="#1d4ed8" font-family="Consolas,monospace">:716 CAS 改 tag（100→Klass）</text>
  <text x="729" y="488" text-anchor="middle" font-size="9.5" fill="#b91c1c" opacity="0.9">失败 → :695 save_and_throw + InError(103)</text>

