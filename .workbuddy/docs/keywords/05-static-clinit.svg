<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#E4DCC8"/>
    </pattern>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#B8A98A" flood-opacity="0.35"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4C6FAF"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#E08A3C"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#3E9E6B"/>
    </marker>
    <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#8E5BB5"/>
    </marker>
  </defs>

  <!-- 底 -->
  <rect width="1200" height="860" fill="#FAF6EF"/>
  <rect width="1200" height="860" fill="url(#dots)"/>

  <!-- 标题 -->
  <text x="60" y="52" font-size="27" font-weight="bold" fill="#3A3A3A">类初始化 &lt;clinit&gt; 状态机</text>
  <text x="60" y="80" font-size="14.5" fill="#8A7F6A">InstanceKlass::initialize_impl · instanceKlass.cpp:1417 · 六态 ClassState（instanceKlass.hpp:195）</text>

  <!-- ==================== 主状态机带 ==================== -->
  <text x="60" y="130" font-size="16" font-weight="bold" fill="#4C6FAF">① 主状态机（加载-链接已完成）</text>

  <!-- linked -->
  <rect x="60" y="150" width="190" height="72" rx="12" fill="#FFFFFF" stroke="#4C6FAF" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="150" width="7" height="72" rx="3.5" fill="#4C6FAF"/>
  <text x="84" y="180" font-size="17" font-weight="bold" fill="#4C6FAF">linked</text>
  <text x="84" y="202" font-size="12" fill="#6A6A6A">链接/校验完成</text>

  <!-- being_initialized -->
  <rect x="430" y="150" width="240" height="72" rx="12" fill="#FFFFFF" stroke="#E08A3C" stroke-width="2" filter="url(#shadow)"/>
  <rect x="430" y="150" width="7" height="72" rx="3.5" fill="#E08A3C"/>
  <text x="454" y="180" font-size="17" font-weight="bold" fill="#E08A3C">being_initialized</text>
  <text x="454" y="202" font-size="12" fill="#6A6A6A">正在跑 &lt;clinit&gt; · _init_thread = 我</text>

  <!-- fully_initialized -->
  <rect x="820" y="150" width="210" height="72" rx="12" fill="#FFFFFF" stroke="#3E9E6B" stroke-width="2" filter="url(#shadow)"/>
  <rect x="820" y="150" width="7" height="72" rx="3.5" fill="#3E9E6B"/>
  <text x="844" y="180" font-size="17" font-weight="bold" fill="#3E9E6B">fully_initialized</text>
  <text x="844" y="202" font-size="12" fill="#6A6A6A">成功终态 · 锁被清空</text>

  <!-- initialization_error -->
  <rect x="820" y="330" width="210" height="72" rx="12" fill="#FFFFFF" stroke="#8E5BB5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="820" y="330" width="7" height="72" rx="3.5" fill="#8E5BB5"/>
  <text x="844" y="360" font-size="17" font-weight="bold" fill="#8E5BB5">initialization_error</text>
  <text x="844" y="382" font-size="12" fill="#6A6A6A">失败终态 · 永久冻结</text>

  <!-- 主转移箭头 -->
  <line x1="250" y1="186" x2="424" y2="186" stroke="#E08A3C" stroke-width="2.5" marker-end="url(#arrO)"/>
  <text x="282" y="176" font-size="12.5" fill="#B06A20">首次触达</text>
  <text x="282" y="192" font-size="11.5" fill="#A08060">拿 mirror 锁 · Step 6</text>

  <line x1="670" y1="186" x2="814" y2="186" stroke="#3E9E6B" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="692" y="176" font-size="12.5" fill="#2E7A50">&lt;clinit&gt; 成功</text>
  <text x="692" y="192" font-size="11.5" fill="#A08060">Step 9 · notify_all</text>

  <path d="M 880 222 L 880 262 L 500 262 L 500 226" fill="none" stroke="#8E5BB5" stroke-width="2.5" marker-end="url(#arrP)" stroke-dasharray="7 5"/>
  <text x="672" y="254" font-size="12.5" fill="#6A4B8F">&lt;clinit&gt; 抛异常 → ExceptionInInitializerError</text>
  <text x="672" y="270" font-size="11.5" fill="#A08060">Step 10/11 · add_initialization_error</text>

  <!-- error 之后的再次访问 -->
  <path d="M 820 366 L 300 366 L 300 220" fill="none" stroke="#8E5BB5" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="330" y="356" font-size="12" fill="#6A4B8F">再访问 → 秒抛 NoClassDefFoundError（Step 5）</text>

  <!-- ==================== clinit 执行细节带 ==================== -->
  <text x="60" y="448" font-size="16" font-weight="bold" fill="#E08A3C">② &lt;clinit&gt; 执行细节（初始化线程 T1）</text>

  <!-- 锁 -->
  <rect x="60" y="468" width="200" height="86" rx="12" fill="#FFFFFF" stroke="#E08A3C" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="60" y="468" width="7" height="86" rx="3.5" fill="#E08A3C"/>
  <text x="84" y="494" font-size="15" font-weight="bold" fill="#E08A3C">Step 6 · 当选执行者</text>
  <text x="84" y="516" font-size="12" fill="#555">set_init_state(being_initialized)</text>
  <text x="84" y="534" font-size="12" fill="#555">set_init_thread(T1)</text>
  <text x="84" y="550" font-size="11" fill="#9A8F78">锁住在 Java mirror（:910）</text>

  <!-- 父类 -->
  <rect x="300" y="468" width="200" height="86" rx="12" fill="#FFFFFF" stroke="#4C6FAF" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="300" y="468" width="7" height="86" rx="3.5" fill="#4C6FAF"/>
  <text x="324" y="494" font-size="15" font-weight="bold" fill="#4C6FAF">Step 7 · 先父后己</text>
  <text x="324" y="516" font-size="12" fill="#555">super→initialize() 递归</text>
  <text x="324" y="534" font-size="12" fill="#555">默认方法接口也初始化</text>
  <text x="324" y="550" font-size="11" fill="#9A8F78">父失败 → 子必失败</text>

  <!-- clinit -->
  <rect x="540" y="468" width="220" height="86" rx="12" fill="#FFFFFF" stroke="#E08A3C" stroke-width="2.2" filter="url(#shadow)"/>
  <rect x="540" y="468" width="7" height="86" rx="3.5" fill="#E08A3C"/>
  <text x="564" y="494" font-size="15" font-weight="bold" fill="#E08A3C">Step 8 · 跑 &lt;clinit&gt;</text>
  <text x="564" y="516" font-size="12" fill="#555">call_class_initializer（:2019）</text>
  <text x="564" y="534" font-size="12" fill="#555">JavaCalls::call · 无参 void</text>
  <text x="564" y="550" font-size="11" fill="#9A8F78">CDS 归档则免跑</text>

  <!-- strict -->
  <rect x="800" y="468" width="230" height="86" rx="12" fill="#FFFFFF" stroke="#3E9E6B" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="800" y="468" width="7" height="86" rx="3.5" fill="#3E9E6B"/>
  <text x="824" y="494" font-size="15" font-weight="bold" fill="#3E9E6B">Step 8.5 · strict 校验</text>
  <text x="824" y="516" font-size="12" fill="#555">fields_status 位数组逐字段查</text>
  <text x="824" y="534" font-size="12" fill="#555">有 strict static 未赋值 → 抛</text>
  <text x="824" y="550" font-size="11" fill="#9A8F78">JDK 28 新特性（:1587）</text>

  <!-- 步骤箭头 -->
  <line x1="260" y1="511" x2="294" y2="511" stroke="#4C6FAF" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="500" y1="511" x2="534" y2="511" stroke="#E08A3C" stroke-width="2" marker-end="url(#arrO)"/>
  <line x1="760" y1="511" x2="794" y2="511" stroke="#3E9E6B" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- ==================== 并发场景 ==================== -->
  <text x="60" y="600" font-size="16" font-weight="bold" fill="#8E5BB5">③ 并发与异常场景</text>

  <rect x="60" y="620" width="340" height="92" rx="12" fill="#FFFFFF" stroke="#8E5BB5" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="60" y="620" width="7" height="92" rx="3.5" fill="#8E5BB5"/>
  <text x="84" y="648" font-size="15" font-weight="bold" fill="#8E5BB5">T2 并发访问</text>
  <text x="84" y="670" font-size="12.5" fill="#555">看到 being_initialized →</text>
  <text x="84" y="690" font-size="12.5" fill="#555">wait_uninterruptibly 挂起（Step 2）</text>
  <text x="84" y="706" font-size="11" fill="#9A8F78">JFR 事件 ThreadWaitingForClassInit</text>

  <rect x="430" y="620" width="340" height="92" rx="12" fill="#FFFFFF" stroke="#3E9E6B" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="430" y="620" width="7" height="92" rx="3.5" fill="#3E9E6B"/>
  <text x="454" y="648" font-size="15" font-weight="bold" fill="#3E9E6B">T1 自引用（递归重入）</text>
  <text x="454" y="670" font-size="12.5" fill="#555">thread == _init_thread →</text>
  <text x="454" y="690" font-size="12.5" fill="#555">直接放行不等待（Step 3）</text>
  <text x="454" y="706" font-size="11" fill="#9A8F78">无死锁的关键：_init_thread（:286）</text>

  <rect x="800" y="620" width="340" height="92" rx="12" fill="#FFFFFF" stroke="#4C6FAF" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="800" y="620" width="7" height="92" rx="3.5" fill="#4C6FAF"/>
  <text x="824" y="648" font-size="15" font-weight="bold" fill="#4C6FAF">clinit_barrier 快路径</text>
  <text x="824" y="670" font-size="12.5" fill="#555">① state==fully_initialized → 放行</text>
  <text x="824" y="690" font-size="12.5" fill="#555">② r15==_init_thread → 放行</text>
  <text x="824" y="706" font-size="11" fill="#9A8F78">macroAssembler_x86.cpp:4835 · 各 2 条指令</text>

  <!-- 底部注释 -->
  <text x="60" y="752" font-size="13" fill="#8A7F6A">触发点：new（:3756）· getstatic/putstatic（:2376）· invokestatic（:2327）· 父类递归（:1536）· 反射</text>
  <text x="60" y="776" font-size="13" fill="#8A7F6A">x86 TSO 下 _init_state 的 acquire 天然满足（macroAssembler_x86.cpp:4846 注释）</text>
  <text x="60" y="800" font-size="13" fill="#8A7F6A">初始化锁 = mirror 上的隐藏字段，fully_initialized 后清空可 GC（instanceKlass.cpp:910-922）</text>
  <text x="60" y="832" font-size="12.5" fill="#B0A488">蓝=链接·橙=执行中·绿=成功·紫=失败/异常 —— 05-static · JDK 28</text>
</svg>
