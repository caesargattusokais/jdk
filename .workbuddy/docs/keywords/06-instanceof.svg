<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#E4DCC8"/>
    </pattern>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#B8A98A" flood-opacity="0.35"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4C6FAF"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#E08A3C"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#3E9E6B"/>
    </marker>
    <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#8E5BB5"/>
    </marker>
  </defs>

  <!-- 底 -->
  <rect width="1200" height="900" fill="#FAF6EF"/>
  <rect width="1200" height="900" fill="url(#dots)"/>

  <!-- 标题 -->
  <text x="60" y="50" font-size="27" font-weight="bold" fill="#3A3A3A">instanceof 类型检查全链路</text>
  <text x="60" y="78" font-size="14.5" fill="#8A7F6A">字节码 0xc1 · templateTable_x86.cpp:3934 · check_klass_subtype · Klass 双通道</text>

  <!-- ==================== ① 字节码与栈（绿） ==================== -->
  <text x="60" y="122" font-size="16" font-weight="bold" fill="#3E9E6B">① 字节码与操作数栈（对象/字面量域 · 绿）</text>

  <rect x="60" y="138" width="430" height="88" rx="12" fill="#FFFFFF" stroke="#3E9E6B" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="138" width="7" height="88" rx="3.5" fill="#3E9E6B"/>
  <text x="84" y="166" font-size="14.5" font-weight="bold" fill="#3E9E6B">Java 源码 → 字节码</text>
  <text x="84" y="190" font-size="12.5" fill="#4A4A4A">boolean b = o instanceof String;</text>
  <text x="84" y="212" font-size="12.5" fill="#6A6A6A">→ <tspan font-family="monospace" font-weight="bold" fill="#3E9E6B">instanceof #5   (0xc1)</tspan>  · 2 字节常量池索引</text>

  <line x1="492" y1="182" x2="548" y2="182" stroke="#3E9E6B" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="498" y="172" font-size="11.5" fill="#A08060">atos</text>

  <rect x="556" y="138" width="584" height="88" rx="12" fill="#FFFFFF" stroke="#3E9E6B" stroke-width="2" filter="url(#shadow)"/>
  <rect x="556" y="138" width="7" height="88" rx="3.5" fill="#3E9E6B"/>
  <text x="580" y="166" font-size="14.5" font-weight="bold" fill="#3E9E6B">操作数栈：atos → itos</text>
  <text x="580" y="190" font-size="12.5" fill="#4A4A4A">入栈：对象引用（rax）    →   出栈：int 0/1（rax）</text>
  <text x="580" y="212" font-size="12" fill="#6A6A6A">对照 checkcast：atos→atos（对象原样留下）· bytecodes.hpp:236-237</text>

  <!-- ==================== ② 模板解释器（蓝） ==================== -->
  <text x="60" y="268" font-size="16" font-weight="bold" fill="#4C6FAF">② 模板解释器 instanceof()（templateTable_x86.cpp:3934 · 生命周期域 · 蓝）</text>

  <rect x="60" y="284" width="1080" height="148" rx="12" fill="#FFFFFF" stroke="#4C6FAF" stroke-width="2" filter="url(#shadow)"/>

  <!-- 段1 -->
  <rect x="88" y="306" width="182" height="104" rx="9" fill="#F2F6FC" stroke="#4C6FAF" stroke-width="1.6"/>
  <text x="104" y="330" font-size="13.5" font-weight="bold" fill="#4C6FAF">① null 短路</text>
  <text x="104" y="352" font-size="11.5" fill="#4A4A4A">testptr(rax,rax)</text>
  <text x="104" y="370" font-size="11.5" fill="#4A4A4A">jcc(zero, is_null)</text>
  <text x="104" y="394" font-size="10.5" fill="#8A7F6A">null 跳过检查 → rax=0</text>

  <!-- 段2 -->
  <rect x="306" y="306" width="182" height="104" rx="9" fill="#F2F6FC" stroke="#4C6FAF" stroke-width="1.6"/>
  <text x="322" y="330" font-size="13.5" font-weight="bold" fill="#4C6FAF">② 快速化判定</text>
  <text x="322" y="352" font-size="11.5" fill="#4A4A4A">tag==JVM_CONSTANT_Class?</text>
  <text x="322" y="370" font-size="11.5" fill="#4A4A4A">否 → quicken_io_cc</text>
  <text x="322" y="394" font-size="10.5" fill="#8A7F6A">首次执行才 quicken</text>

  <!-- 段3 -->
  <rect x="524" y="306" width="182" height="104" rx="9" fill="#F2F6FC" stroke="#4C6FAF" stroke-width="1.6"/>
  <text x="540" y="330" font-size="13.5" font-weight="bold" fill="#4C6FAF">③ 取两个 Klass</text>
  <text x="540" y="352" font-size="11.5" fill="#4A4A4A">load_klass → 子类</text>
  <text x="540" y="370" font-size="11.5" fill="#4A4A4A">load_resolved → 目标</text>
  <text x="540" y="394" font-size="10.5" fill="#8A7F6A">子类 = 对象头 _klass 字段</text>

  <!-- 段4 -->
  <rect x="742" y="306" width="182" height="104" rx="9" fill="#F2F6FC" stroke="#4C6FAF" stroke-width="1.6"/>
  <text x="758" y="330" font-size="13.5" font-weight="bold" fill="#4C6FAF">④ 子类型检查</text>
  <text x="758" y="352" font-size="11.5" fill="#4A4A4A">gen_subtype_check</text>
  <text x="758" y="370" font-size="11.5" fill="#4A4A4A">(interp_masm:586)</text>
  <text x="758" y="394" font-size="10.5" fill="#8A7F6A">先 profile 后检查</text>

  <!-- 段5 -->
  <rect x="960" y="306" width="158" height="104" rx="9" fill="#F2F6FC" stroke="#4C6FAF" stroke-width="1.6"/>
  <text x="976" y="330" font-size="13.5" font-weight="bold" fill="#4C6FAF">⑤ 出结果</text>
  <text x="976" y="352" font-size="11.5" fill="#4A4A4A">成功 movl rax,1</text>
  <text x="976" y="370" font-size="11.5" fill="#4A4A4A">失败 xorl rax,rax</text>
  <text x="976" y="394" font-size="10.5" fill="#8A7F6A">→ itos 压栈</text>

  <!-- 段间箭头 -->
  <line x1="272" y1="358" x2="302" y2="358" stroke="#4C6FAF" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="490" y1="358" x2="520" y2="358" stroke="#4C6FAF" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="708" y1="358" x2="738" y2="358" stroke="#4C6FAF" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="926" y1="358" x2="956" y2="358" stroke="#4C6FAF" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- ②→③ 箭头 -->
  <line x1="470" y1="432" x2="470" y2="470" stroke="#8E5BB5" stroke-width="2.5" marker-end="url(#arrP)"/>
  <text x="478" y="456" font-size="11.5" fill="#6A4B8F">gen_subtype_check ↓</text>

  <!-- ==================== ③ 汇编层（紫） ==================== -->
  <text x="60" y="494" font-size="16" font-weight="bold" fill="#8E5BB5">③ 汇编核心 check_klass_subtype（macroAssembler_x86.cpp:4047 · 异常/机制域 · 紫）</text>

  <rect x="60" y="510" width="540" height="150" rx="12" fill="#FFFFFF" stroke="#8E5BB5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="510" width="7" height="150" rx="3.5" fill="#8E5BB5"/>
  <text x="84" y="538" font-size="14" font-weight="bold" fill="#8E5BB5">快慢双路径（汇编）</text>
  <text x="84" y="564" font-size="12" fill="#4A4A4A">check_klass_subtype_fast_path(sub, super, temp,</text>
  <text x="84" y="582" font-size="12" fill="#4A4A4A">                                        &amp;L_success, &amp;L_failure, nullptr);</text>
  <text x="84" y="600" font-size="12" fill="#4A4A4A">check_klass_subtype_slow_path(sub, super, temp,</text>
  <text x="84" y="618" font-size="12" fill="#4A4A4A">                                        noreg, &amp;L_success, nullptr);</text>
  <text x="84" y="642" font-size="11.5" fill="#8A7F6A">快路径命中 → L_success；未命中 → 慢路径（接口）</text>

  <line x1="602" y1="585" x2="646" y2="585" stroke="#8E5BB5" stroke-width="2.5" marker-end="url(#arrP)"/>

  <rect x="654" y="510" width="486" height="150" rx="12" fill="#FFFFFF" stroke="#8E5BB5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="654" y="510" width="7" height="150" rx="3.5" fill="#8E5BB5"/>
  <text x="678" y="538" font-size="14" font-weight="bold" fill="#8E5BB5">快路径三段（4058 起）</text>
  <text x="678" y="562" font-size="12" fill="#4A4A4A">① cmpptr(sub, super)  → 自己==目标</text>
  <text x="678" y="582" font-size="12" fill="#4A4A4A">   jcc(equal, L_success)  ← self-check</text>
  <text x="678" y="606" font-size="12" fill="#4A4A4A">② movl(temp, [super+sco_offset])</text>
  <text x="678" y="626" font-size="12" fill="#4A4A4A">   cmpptr(super, [sub+temp])</text>
  <text x="678" y="646" font-size="12" fill="#4A4A4A">   jcc(equal, L_success)  ← 显示表 O(1)</text>

  <!-- ③→④ 箭头 -->
  <line x1="330" y1="660" x2="330" y2="700" stroke="#E08A3C" stroke-width="2.5" marker-end="url(#arrO)"/>
  <text x="340" y="686" font-size="11.5" fill="#B06A20">慢路径 ↓（super_check_offset == secondary）</text>

  <!-- ==================== ④ Klass 双通道（橙） ==================== -->
  <text x="60" y="724" font-size="16" font-weight="bold" fill="#E08A3C">④ Klass 层双通道分派（对象/内存域 · 橙）</text>

  <rect x="60" y="740" width="540" height="130" rx="12" fill="#FFFFFF" stroke="#E08A3C" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="740" width="7" height="130" rx="3.5" fill="#E08A3C"/>
  <text x="84" y="766" font-size="14" font-weight="bold" fill="#E08A3C">通道 A：显示表比对（普通类）</text>
  <text x="84" y="790" font-size="12" fill="#4A4A4A">is_subtype_of（klass.inline.hpp:121）</text>
  <text x="84" y="810" font-size="12" fill="#4A4A4A">off = k-&gt;super_check_offset()</text>
  <text x="84" y="830" font-size="12" fill="#4A4A4A">sup = *(Klass**)(this + off);  return sup == k;</text>
  <text x="84" y="854" font-size="11.5" fill="#8A7F6A">一次内存读 + 一次比较 → O(1) 热路径</text>

  <line x1="602" y1="805" x2="646" y2="805" stroke="#E08A3C" stroke-width="2.5" marker-end="url(#arrO)"/>

  <rect x="654" y="740" width="486" height="130" rx="12" fill="#FFFFFF" stroke="#E08A3C" stroke-width="2" filter="url(#shadow)"/>
  <rect x="654" y="740" width="7" height="130" rx="3.5" fill="#E08A3C"/>
  <text x="678" y="766" font-size="14" font-weight="bold" fill="#E08A3C">通道 B：secondary_supers（接口）</text>
  <text x="678" y="790" font-size="12" fill="#4A4A4A">位图：bit==0 → return false（确定性拒绝）</text>
  <text x="678" y="810" font-size="12" fill="#4A4A4A">哈希：index=popcount(shifted)-1 → 一次命中?</text>
  <text x="678" y="830" font-size="12" fill="#4A4A4A">探测：fallback_search（klass.cpp:175）</text>
  <text x="678" y="854" font-size="11.5" fill="#8A7F6A">位图 + 哈希 + 线性探测 · 满2槽退线性（158）</text>

  <!-- ==================== 结果徽章 ==================== -->
  <rect x="250" y="885" width="0" height="0" fill="none"/>
