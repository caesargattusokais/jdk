<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#E4DCC8"/>
    </pattern>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#B8A98A" flood-opacity="0.35"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4C6FAF"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#E08A3C"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#3E9E6B"/>
    </marker>
    <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#8E5BB5"/>
    </marker>
  </defs>

  <!-- 底 -->
  <rect width="1200" height="900" fill="#FAF6EF"/>
  <rect width="1200" height="900" fill="url(#dots)"/>

  <!-- 标题 -->
  <text x="60" y="50" font-size="27" font-weight="bold" fill="#3A3A3A">控制流 + 字面量 + 编译期型：三派分法</text>
  <text x="60" y="78" font-size="14.5" fill="#8A7F6A">机制型（有字节码：if/switch/return）· 字面量型（true/false/null/void）· 纯编译期型（yield/var/assert/strictfp/_）</text>

  <!-- ==================== 卡片 1（蓝）：if/else + 循环 = goto 家族 ==================== -->
  <rect x="60" y="110" width="360" height="330" rx="14" fill="#FFFFFF" stroke="#4C6FAF" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="110" width="7" height="330" rx="3.5" fill="#4C6FAF"/>
  <text x="84" y="142" font-size="16" font-weight="bold" fill="#4C6FAF">if/else + 循环 → 共享模板</text>
  <text x="84" y="166" font-size="12" fill="#4A4A4A">if 家族 0x99-0xa6（14 条）· <tspan font-family="monospace">else</tspan> 无字节码</text>

  <rect x="84" y="184" width="312" height="88" rx="9" fill="#F2F6FC" stroke="#4C6FAF" stroke-width="1.5"/>
  <text x="100" y="206" font-size="12" font-weight="bold" fill="#3D5A99">4 个模板函数 × 条件参数化</text>
  <text x="100" y="228" font-size="11.5" fill="#4A4A4A">if_0cmp / if_icmp / if_acmp / if_nullcmp</text>
  <text x="100" y="248" font-size="11" fill="#8A7F6A">templateTable_x86.cpp:1918-1999</text>

  <rect x="84" y="288" width="312" height="66" rx="9" fill="#FFFFFF" stroke="#4C6FAF" stroke-width="1.5"/>
  <text x="100" y="310" font-size="12" font-weight="bold" fill="#3D5A99">for/while/do + break/continue = if + goto</text>
  <text x="100" y="330" font-size="11.5" fill="#4A4A4A">全部无专属字节码，break/continue 就是 goto</text>

  <rect x="84" y="370" width="312" height="52" rx="9" fill="#F2F6FC" stroke="#4C6FAF" stroke-width="1.5"/>
  <text x="100" y="392" font-size="11.5" font-weight="bold" fill="#3D5A99">回边计数 → OSR 栈上替换</text>
  <text x="100" y="410" font-size="11" fill="#8A7F6A">branch()（templateTable_x86.cpp:1749）</text>

  <!-- ==================== 卡片 2（绿）：switch 双形态 ==================== -->
  <rect x="440" y="110" width="360" height="330" rx="14" fill="#FFFFFF" stroke="#3E9E6B" stroke-width="2" filter="url(#shadow)"/>
  <rect x="440" y="110" width="7" height="330" rx="3.5" fill="#3E9E6B"/>
  <text x="464" y="142" font-size="16" font-weight="bold" fill="#3E9E6B">switch → javac 成本决策</text>
  <text x="464" y="166" font-size="12" fill="#4A4A4A">tableswitch 0xaa / lookupswitch 0xab</text>

  <rect x="464" y="184" width="312" height="80" rx="9" fill="#EEF7F1" stroke="#3E9E6B" stroke-width="1.5"/>
  <text x="480" y="206" font-size="12" font-weight="bold" fill="#2E7A50">决策公式：空间 + 3×时间 取小</text>
  <text x="480" y="228" font-size="11" fill="#4A4A4A">table: (hi-lo+1)+4 vs lookup: 3+2n</text>
  <text x="480" y="246" font-size="11" fill="#8A7F6A">Gen.java:1380-1391 · 密集→跳表 / 稀疏→键值表</text>

  <rect x="464" y="278" width="150" height="110" rx="9" fill="#FFFFFF" stroke="#3E9E6B" stroke-width="1.5"/>
  <text x="478" y="300" font-size="12" font-weight="bold" fill="#2E7A50">tableswitch</text>
  <text x="478" y="322" font-size="11" fill="#4A4A4A">对齐→范围检查→</text>
  <text x="478" y="340" font-size="11" fill="#4A4A4A">跳表 O(1) 分发</text>
  <text x="478" y="362" font-size="10" fill="#8A7F6A">templateTable_x86:2033</text>

  <rect x="626" y="278" width="150" height="110" rx="9" fill="#EEF7F1" stroke="#3E9E6B" stroke-width="1.5"/>
  <text x="640" y="300" font-size="12" font-weight="bold" fill="#2E7A50">lookupswitch</text>
  <text x="640" y="322" font-size="11" fill="#4A4A4A">模板 stop("rewritten")</text>
  <text x="640" y="340" font-size="11" fill="#4A4A4A">改写：&lt;5 线性 / ≥5 二分</text>
  <text x="640" y="362" font-size="10" fill="#8A7F6A">rewriter.cpp:410-427</text>

  <rect x="464" y="402" width="312" height="30" rx="8" fill="#FFF6EC" stroke="#E08A3C" stroke-width="1.5"/>
  <text x="480" y="422" font-size="11.5" font-weight="bold" fill="#B06A20">BinarySwitchThreshold = 5（globals.hpp:1579）</text>

  <!-- ==================== 卡片 3（橙）：return 家族 ==================== -->
  <rect x="820" y="110" width="320" height="330" rx="14" fill="#FFFFFF" stroke="#E08A3C" stroke-width="2" filter="url(#shadow)"/>
  <rect x="820" y="110" width="7" height="330" rx="3.5" fill="#E08A3C"/>
  <text x="844" y="142" font-size="16" font-weight="bold" fill="#E08A3C">return → 一个模板六种状态</text>
  <text x="844" y="166" font-size="12" fill="#4A4A4A">ireturn…return（0xac-0xb1）</text>

  <rect x="844" y="184" width="272" height="66" rx="9" fill="#FFF6EC" stroke="#E08A3C" stroke-width="1.5"/>
  <text x="860" y="206" font-size="12" font-weight="bold" fill="#B06A20">六条指令共享 _return(state)</text>
  <text x="860" y="226" font-size="11.5" fill="#4A4A4A">区别只有 TosState：i/l/f/d/a/v</text>
  <text x="860" y="244" font-size="11" fill="#8A7F6A">templateTable.cpp:407-412</text>

  <rect x="844" y="266" width="272" height="94" rx="9" fill="#FFFFFF" stroke="#E08A3C" stroke-width="1.5"/>
  <text x="860" y="288" font-size="12" font-weight="bold" fill="#B06A20">模板三步（:2221）</text>
  <text x="860" y="308" font-size="11" fill="#4A4A4A">① safepoint poll（方法出口安全点）</text>
  <text x="860" y="326" font-size="11" fill="#4A4A4A">② itos 收窄 narrow(rax)</text>
  <text x="860" y="344" font-size="11" fill="#4A4A4A">③ remove_activation 撤帧跳回调用者</text>

  <rect x="844" y="376" width="272" height="46" rx="9" fill="#FFF6EC" stroke="#E08A3C" stroke-width="1.5"/>
  <text x="860" y="396" font-size="11" font-weight="bold" fill="#B06A20">彩蛋：return_register_finalizer</text>
  <text x="860" y="412" font-size="10.5" fill="#8A7F6A">Object.&lt;init&gt; 出口注册 finalizer（:2227）</text>

  <!-- ==================== 紫条：无字节码派 ==================== -->
  <text x="60" y="478" font-size="16" font-weight="bold" fill="#8E5BB5">纯编译期型：class 文件零痕迹（字面量 true/false/null 除外）</text>

  <rect x="60" y="494" width="1080" height="122" rx="12" fill="#FFFFFF" stroke="#8E5BB5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="494" width="7" height="122" rx="3.5" fill="#8E5BB5"/>

  <rect x="88" y="512" width="242" height="86" rx="9" fill="#FAF4FD" stroke="#8E5BB5" stroke-width="1.5"/>
  <text x="104" y="534" font-size="12" font-weight="bold" fill="#6A4B8F">yield</text>
  <text x="104" y="554" font-size="11" fill="#4A4A4A">受限标识符 · 仅 switch 表达式</text>
  <text x="104" y="574" font-size="10.5" fill="#8A7F6A">Resolve.java:2607 · 无字节码</text>

  <rect x="344" y="512" width="242" height="86" rx="9" fill="#FAF4FD" stroke="#8E5BB5" stroke-width="1.5"/>
  <text x="360" y="534" font-size="12" font-weight="bold" fill="#6A4B8F">var / _</text>
  <text x="360" y="554" font-size="11" fill="#4A4A4A">受限类型名（var）· 保留字（_）</text>
  <text x="360" y="574" font-size="10.5" fill="#8A7F6A">Resolve.java:2605 · 推断零痕迹</text>

  <rect x="600" y="512" width="242" height="86" rx="9" fill="#FAF4FD" stroke="#8E5BB5" stroke-width="1.5"/>
  <text x="616" y="534" font-size="12" font-weight="bold" fill="#6A4B8F">assert</text>
  <text x="616" y="554" font-size="11" fill="#4A4A4A">$assertionsDisabled + if + athrow</text>
  <text x="616" y="574" font-size="10.5" fill="#8A7F6A">Lower.java:3137 · 恒真条件整体删除</text>

  <rect x="856" y="512" width="258" height="86" rx="9" fill="#FAF4FD" stroke="#8E5BB5" stroke-width="1.5"/>
  <text x="872" y="534" font-size="12" font-weight="bold" fill="#6A4B8F">strictfp</text>
  <text x="872" y="554" font-size="11" fill="#4A4A4A">ACC_STRICT · JDK 17 起剥除</text>
  <text x="872" y="574" font-size="10.5" fill="#8A7F6A">classFileParser.cpp:2291 · no-op 关键字</text>

  <!-- ==================== 底部速查表 ==================== -->
  <text x="60" y="652" font-size="16" font-weight="bold" fill="#E08A3C">三派速查</text>

  <rect x="60" y="668" width="1080" height="210" rx="12" fill="#FFFFFF" stroke="#E08A3C" stroke-width="2" filter="url(#shadow)"/>

  <rect x="88" y="690" width="190" height="40" rx="7" fill="#FFF6EC" stroke="#E08A3C" stroke-width="1.5"/>
  <text x="183" y="716" text-anchor="middle" font-size="13" font-weight="bold" fill="#B06A20">维度</text>
  <rect x="286" y="690" width="280" height="40" rx="7" fill="#F2F6FC" stroke="#4C6FAF" stroke-width="1.5"/>
  <text x="426" y="716" text-anchor="middle" font-size="13" font-weight="bold" fill="#3D5A99">机制型（if/switch/return）</text>
  <rect x="574" y="690" width="260" height="40" rx="7" fill="#EEF7F1" stroke="#3E9E6B" stroke-width="1.5"/>
  <text x="704" y="716" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7A50">字面量型（true/null/void）</text>
  <rect x="842" y="690" width="276" height="40" rx="7" fill="#FAF4FD" stroke="#8E5BB5" stroke-width="1.5"/>
  <text x="980" y="716" text-anchor="middle" font-size="13" font-weight="bold" fill="#6A4B8F">纯编译期型（yield/var/…）</text>

  <text x="100" y="760" font-size="12" fill="#555">字节码</text>
  <text x="300" y="760" font-size="12" fill="#444">0x99-0xa6 / 0xaa-0xab / 0xac-0xb1</text>
  <text x="588" y="760" font-size="12" fill="#444">iconst / aconst_null（0x01-0x08）</text>
  <text x="856" y="760" font-size="12" fill="#444">无（或合成 if+athrow）</text>

  <text x="100" y="790" font-size="12" fill="#555">运行期</text>
  <text x="300" y="790" font-size="12" fill="#444">共享模板 + 改写 + 计数/OSR</text>
  <text x="588" y="790" font-size="12" fill="#444">常量入栈（零成本）</text>
  <text x="856" y="790" font-size="12" fill="#444">javac 检查 / 降级，零痕迹</text>

  <text x="100" y="820" font-size="12" fill="#555">代表锚点</text>
  <text x="300" y="820" font-size="12" fill="#4C6FAF">templateTable_x86:1749/2033/2221</text>
  <text x="588" y="820" font-size="12" fill="#3E9E6B">bytecodes.hpp:45-48</text>
  <text x="856" y="820" font-size="12" fill="#8E5BB5">Lower.java:3137 / Resolve.java:2605</text>

  <text x="100" y="850" font-size="12" fill="#555">一句话</text>
  <text x="300" y="850" font-size="12" fill="#8A7F6A">语言控制流的引擎</text>
  <text x="588" y="850" font-size="12" fill="#8A7F6A">常量入栈的原语</text>
  <text x="856" y="850" font-size="12" fill="#8A7F6A">编译器的检查规则</text>
</svg>
