<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#E4DCC8"/>
    </pattern>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#B8A98A" flood-opacity="0.35"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4C6FAF"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#E08A3C"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#3E9E6B"/>
    </marker>
    <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#8E5BB5"/>
    </marker>
  </defs>

  <!-- 底 -->
  <rect width="1200" height="900" fill="#FAF6EF"/>
  <rect width="1200" height="900" fill="url(#dots)"/>

  <!-- 标题 -->
  <text x="60" y="50" font-size="27" font-weight="bold" fill="#3A3A3A">异常处理：布局 + 查表</text>
  <text x="60" y="78" font-size="14.5" fill="#8A7F6A">异常表 ExceptionTableElement（constMethod.hpp:111）· athrow 0xbf · fast_exception_handler_bci_for（method.cpp:275）</text>

  <!-- ==================== ① 编译期（绿） ==================== -->
  <text x="60" y="122" font-size="16" font-weight="bold" fill="#3E9E6B">① 编译期：javac 摊平 try/catch/finally → 字节码 + 异常表（对象/源码域 · 绿）</text>

  <rect x="60" y="138" width="360" height="140" rx="12" fill="#FFFFFF" stroke="#3E9E6B" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="138" width="7" height="140" rx="3.5" fill="#3E9E6B"/>
  <text x="84" y="166" font-size="14" font-weight="bold" fill="#3E9E6B">Java 源码</text>
  <text x="84" y="192" font-size="12.5" fill="#4A4A4A">try { risky(); }</text>
  <text x="84" y="212" font-size="12.5" fill="#4A4A4A">catch (IOException e) { … }</text>
  <text x="84" y="232" font-size="12.5" fill="#4A4A4A">finally { cleanup(); }</text>
  <text x="84" y="260" font-size="11.5" fill="#8A7F6A">javac：无 finally 指令，只有复制 + 异常表</text>

  <line x1="422" y1="208" x2="478" y2="208" stroke="#3E9E6B" stroke-width="2.5" marker-end="url(#arrG)"/>

  <rect x="486" y="138" width="654" height="140" rx="12" fill="#FFFFFF" stroke="#3E9E6B" stroke-width="2" filter="url(#shadow)"/>
  <rect x="486" y="138" width="7" height="140" rx="3.5" fill="#3E9E6B"/>
  <text x="510" y="166" font-size="14" font-weight="bold" fill="#3E9E6B">字节码（javap -c 视角）</text>
  <text x="510" y="190" font-size="12" fill="#4A4A4A">0: invokestatic risky        ← try 块</text>
  <text x="510" y="210" font-size="12" fill="#4A4A4A">3: invokestatic cleanup      ← 正常出口复制 finally</text>
  <text x="510" y="230" font-size="12" fill="#4A4A4A">9: astore_1 / cleanup / aload_1 / athrow  ← 异常出口复制</text>
  <text x="510" y="252" font-size="11.5" fill="#8A7F6A">finally 代码出现 2 次 —— 复制语义（§6）</text>
  <text x="510" y="270" font-size="11.5" fill="#8A7F6A">synchronized 的 monitorexit 也靠这个（02 篇）</text>

  <!-- ==================== ② 异常表结构（蓝） ==================== -->
  <text x="60" y="320" font-size="16" font-weight="bold" fill="#4C6FAF">② 异常表数据结构（生命周期/声明域 · 蓝）</text>

  <rect x="60" y="336" width="1080" height="132" rx="12" fill="#FFFFFF" stroke="#4C6FAF" stroke-width="2" filter="url(#shadow)"/>

  <!-- 表头 -->
  <rect x="88" y="358" width="240" height="88" rx="9" fill="#F2F6FC" stroke="#4C6FAF" stroke-width="1.6"/>
  <text x="104" y="382" font-size="13.5" font-weight="bold" fill="#4C6FAF">start_pc（u2）</text>
  <text x="104" y="404" font-size="11.5" fill="#4A4A4A">try 块起点 bci（含）</text>
  <text x="104" y="428" font-size="11" fill="#8A7F6A">如 try 从 bci 0 开始</text>

  <rect x="352" y="358" width="240" height="88" rx="9" fill="#F2F6FC" stroke="#4C6FAF" stroke-width="1.6"/>
  <text x="368" y="382" font-size="13.5" font-weight="bold" fill="#4C6FAF">end_pc（u2）</text>
  <text x="368" y="404" font-size="11.5" fill="#4A4A4A">try 块终点 bci（不含）</text>
  <text x="368" y="428" font-size="11" fill="#8A7F6A">区间 [start, end) 半开</text>

  <rect x="616" y="358" width="240" height="88" rx="9" fill="#F2F6FC" stroke="#4C6FAF" stroke-width="1.6"/>
  <text x="632" y="382" font-size="13.5" font-weight="bold" fill="#4C6FAF">handler_pc（u2）</text>
  <text x="632" y="404" font-size="11.5" fill="#4A4A4A">catch/finally 起点 bci</text>
  <text x="632" y="428" font-size="11" fill="#8A7F6A">命中后改 bcp 跳这里</text>

  <rect x="880" y="358" width="238" height="88" rx="9" fill="#F2F6FC" stroke="#4C6FAF" stroke-width="1.6"/>
  <text x="896" y="382" font-size="13.5" font-weight="bold" fill="#4C6FAF">catch_type_index（u2）</text>
  <text x="896" y="404" font-size="11.5" fill="#4A4A4A">捕获类型常量池索引</text>
  <text x="896" y="426" font-size="11" fill="#B06A20">0 = catch-all（finally）</text>
  <text x="896" y="442" font-size="10.5" fill="#8A7F6A">constMethod.hpp:111-117</text>

  <!-- ==================== ③ 运行期查表（紫） ==================== -->
  <text x="60" y="508" font-size="16" font-weight="bold" fill="#8E5BB5">③ 运行期：athrow → 查表算法（异常域 · 紫）</text>

  <rect x="60" y="524" width="200" height="130" rx="12" fill="#FFFFFF" stroke="#8E5BB5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="524" width="7" height="130" rx="3.5" fill="#8E5BB5"/>
  <text x="84" y="550" font-size="13.5" font-weight="bold" fill="#8E5BB5">athrow</text>
  <text x="84" y="574" font-size="11.5" fill="#4A4A4A">templateTable:4022</text>
  <text x="84" y="594" font-size="11.5" fill="#4A4A4A">null_check → NPE</text>
  <text x="84" y="614" font-size="11.5" fill="#4A4A4A">jump throw_exception_entry</text>
  <text x="84" y="638" font-size="10.5" fill="#8A7F6A">bytecodes.hpp:235 · 0xbf</text>

  <line x1="262" y1="589" x2="318" y2="589" stroke="#8E5BB5" stroke-width="2.5" marker-end="url(#arrP)"/>

  <rect x="326" y="524" width="240" height="130" rx="12" fill="#FFFFFF" stroke="#8E5BB5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="326" y="524" width="7" height="130" rx="3.5" fill="#8E5BB5"/>
  <text x="350" y="550" font-size="13.5" font-weight="bold" fill="#8E5BB5">① 区间覆盖</text>
  <text x="350" y="574" font-size="11.5" fill="#4A4A4A">顺序扫描异常表</text>
  <text x="350" y="594" font-size="11.5" fill="#4A4A4A">beg ≤ bci &lt; end ?</text>
  <text x="350" y="614" font-size="11.5" fill="#4A4A4A">不覆盖 → 下一条</text>
  <text x="350" y="638" font-size="10.5" fill="#8A7F6A">method.cpp:287-296</text>

  <line x1="568" y1="589" x2="624" y2="589" stroke="#8E5BB5" stroke-width="2.5" marker-end="url(#arrP)"/>

  <rect x="632" y="524" width="240" height="130" rx="12" fill="#FFFFFF" stroke="#8E5BB5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="632" y="524" width="7" height="130" rx="3.5" fill="#8E5BB5"/>
  <text x="656" y="550" font-size="13.5" font-weight="bold" fill="#8E5BB5">② catch-all 短路</text>
  <text x="656" y="574" font-size="11.5" fill="#4A4A4A">catch_type_index == 0 ?</text>
  <text x="656" y="594" font-size="11.5" fill="#4A4A4A">finally / catch(Exception)</text>
  <text x="656" y="614" font-size="11.5" fill="#B06A20">免类型比较直接命中</text>
  <text x="656" y="638" font-size="10.5" fill="#8A7F6A">method.cpp:302-308</text>

  <line x1="874" y1="589" x2="930" y2="589" stroke="#8E5BB5" stroke-width="2.5" marker-end="url(#arrP)"/>

  <rect x="938" y="524" width="202" height="130" rx="12" fill="#FFFFFF" stroke="#8E5BB5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="938" y="524" width="7" height="130" rx="3.5" fill="#8E5BB5"/>
  <text x="962" y="550" font-size="13.5" font-weight="bold" fill="#8E5BB5">③ 子类型判定</text>
  <text x="962" y="574" font-size="11.5" fill="#4A4A4A">is_subtype_of(k)</text>
  <text x="962" y="594" font-size="11.5" fill="#4A4A4A">06 篇算法复用！</text>
  <text x="962" y="614" font-size="11.5" fill="#4A4A4A">命中 → handler</text>
  <text x="962" y="638" font-size="10.5" fill="#8A7F6A">method.cpp:336</text>

  <!-- 结果分流 -->
  <path d="M 560 654 L 560 690 L 700 690" fill="none" stroke="#3E9E6B" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="570" y="682" font-size="11.5" fill="#2E7A50">handler_bci ≥ 0</text>

  <path d="M 700 589 L 700 662 L 700 690 L 320 690 L 320 662" fill="none" stroke="#8E5BB5" stroke-width="2.5" marker-end="url(#arrP)" stroke-dasharray="7 5"/>
  <text x="430" y="682" font-size="11.5" fill="#6A4B8F">无 handler（-1）→ remove_activation_entry 解栈上抛</text>

  <!-- ==================== ④ finally 复制（橙） ==================== -->
  <text x="60" y="726" font-size="16" font-weight="bold" fill="#E08A3C">④ finally 复制语义（控制流 · 橙）</text>

  <rect x="60" y="742" width="1080" height="128" rx="12" fill="#FFFFFF" stroke="#E08A3C" stroke-width="2" filter="url(#shadow)"/>

  <rect x="88" y="764" width="300" height="84" rx="9" fill="#FFF6EC" stroke="#E08A3C" stroke-width="1.6"/>
  <text x="104" y="790" font-size="13" font-weight="bold" fill="#E08A3C">正常出口</text>
  <text x="104" y="812" font-size="11.5" fill="#4A4A4A">try 跑完 → 直接执行复制出的</text>
  <text x="104" y="832" font-size="11.5" fill="#4A4A4A">finally 代码 → return/goto</text>

  <line x1="390" y1="806" x2="446" y2="806" stroke="#E08A3C" stroke-width="2.5" marker-end="url(#arrO)"/>

  <rect x="454" y="764" width="320" height="84" rx="9" fill="#FFF6EC" stroke="#E08A3C" stroke-width="1.6"/>
  <text x="470" y="790" font-size="13" font-weight="bold" fill="#E08A3C">异常出口（catch-all 兜底）</text>
  <text x="470" y="812" font-size="11.5" fill="#4A4A4A">异常表 type=0 命中 → 复制出的</text>
  <text x="470" y="832" font-size="11.5" fill="#4A4A4A">finally 代码 → aload_1 + athrow 重抛</text>

  <line x1="776" y1="806" x2="832" y2="806" stroke="#E08A3C" stroke-width="2.5" marker-end="url(#arrO)"/>

  <rect x="840" y="764" width="278" height="84" rx="9" fill="#FFF6EC" stroke="#E08A3C" stroke-width="1.6"/>
  <text x="856" y="790" font-size="13" font-weight="bold" fill="#E08A3C">后果</text>
  <text x="856" y="812" font-size="11.5" fill="#4A4A4A">finally 代码在 class 文件中出现多次</text>
  <text x="856" y="832" font-size="11.5" fill="#B06A20">finally 里 return 会吞异常</text>
</svg>
