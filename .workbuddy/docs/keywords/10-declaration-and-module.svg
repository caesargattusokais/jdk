<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#E4DCC8"/>
    </pattern>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#B8A98A" flood-opacity="0.35"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4C6FAF"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#E08A3C"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#3E9E6B"/>
    </marker>
    <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#8E5BB5"/>
    </marker>
  </defs>

  <!-- 底 -->
  <rect width="1200" height="900" fill="#FAF6EF"/>
  <rect width="1200" height="900" fill="url(#dots)"/>

  <!-- 标题 -->
  <text x="60" y="50" font-size="27" font-weight="bold" fill="#3A3A3A">声明域 + 访问控制 + module：class 文件头部的一本账</text>
  <text x="60" y="78" font-size="14.5" fill="#8A7F6A">access_flags（jvm_constants.h:31）· super_class/interfaces（classFileParser.cpp:4005）· module-info 解析在 Java 层（jvm.cpp:1316）</text>

  <!-- ==================== 卡片 1（蓝）：声明域 ==================== -->
  <rect x="60" y="110" width="360" height="330" rx="14" fill="#FFFFFF" stroke="#4C6FAF" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="110" width="7" height="330" rx="3.5" fill="#4C6FAF"/>
  <text x="84" y="142" font-size="16" font-weight="bold" fill="#4C6FAF">声明域 → access_flags 一本账</text>
  <text x="84" y="166" font-size="12" fill="#4A4A4A">class/interface/enum/record + abstract/sealed/permits</text>

  <rect x="84" y="184" width="312" height="120" rx="9" fill="#F2F6FC" stroke="#4C6FAF" stroke-width="1.5"/>
  <text x="100" y="206" font-size="12" font-weight="bold" fill="#3D5A99">形态 = 标志组合（:4507-4511）</text>
  <text x="100" y="228" font-size="11" fill="#4A4A4A">interface = INTERFACE+ABSTRACT</text>
  <text x="100" y="246" font-size="11" fill="#4A4A4A">enum      = FINAL+ENUM</text>
  <text x="100" y="264" font-size="11" fill="#4A4A4A">record    = FINAL+RECORD+Record属性</text>
  <text x="100" y="282" font-size="11" fill="#4A4A4A">sealed    = SEALED+PermittedSubclasses</text>
  <text x="100" y="300" font-size="10.5" fill="#8A7F6A">校验：abstract+final 非法（:4516）</text>

  <rect x="84" y="318" width="312" height="104" rx="9" fill="#FFFFFF" stroke="#4C6FAF" stroke-width="1.5"/>
  <text x="100" y="340" font-size="12" font-weight="bold" fill="#3D5A99">extends/implements → 索引</text>
  <text x="100" y="362" font-size="11" fill="#4A4A4A">super_class 1 个 u2 + interfaces 数组</text>
  <text x="100" y="382" font-size="11" fill="#4A4A4A">链接期 initialize_supers 建继承链</text>
  <text x="100" y="402" font-size="11" fill="#8A7F6A">→ 06 篇 instanceof 的 super_check 就跑在这条链上</text>

  <!-- ==================== 卡片 2（绿）：访问控制 ==================== -->
  <rect x="440" y="110" width="360" height="330" rx="14" fill="#FFFFFF" stroke="#3E9E6B" stroke-width="2" filter="url(#shadow)"/>
  <rect x="440" y="110" width="7" height="330" rx="3.5" fill="#3E9E6B"/>
  <text x="464" y="142" font-size="16" font-weight="bold" fill="#3E9E6B">访问控制 → 只有位没有兵</text>
  <text x="464" y="166" font-size="12" fill="#4A4A4A">public/protected/private + package/import/transient</text>

  <rect x="464" y="184" width="312" height="88" rx="9" fill="#EEF7F1" stroke="#3E9E6B" stroke-width="1.5"/>
  <text x="480" y="206" font-size="12" font-weight="bold" fill="#2E7A50">VM 只做互斥检查（:4551）</text>
  <text x="480" y="228" font-size="11" fill="#4A4A4A">public∧protected / public∧private / protected∧private</text>
  <text x="480" y="248" font-size="11" fill="#4A4A4A">三互斥 → 非法标志报错</text>
  <text x="480" y="266" font-size="11" fill="#8A7F6A">真正的访问控制在 javac + 反射层</text>

  <rect x="464" y="286" width="150" height="92" rx="9" fill="#FFFFFF" stroke="#3E9E6B" stroke-width="1.5"/>
  <text x="478" y="308" font-size="12" font-weight="bold" fill="#2E7A50">package</text>
  <text x="478" y="330" font-size="11" fill="#4A4A4A">并入全限定名</text>
  <text x="478" y="348" font-size="11" fill="#4A4A4A">无字节码无属性</text>
  <text x="478" y="366" font-size="10" fill="#8A7F6A">包→模块归属</text>

  <rect x="626" y="286" width="150" height="92" rx="9" fill="#EEF7F1" stroke="#3E9E6B" stroke-width="1.5"/>
  <text x="640" y="308" font-size="12" font-weight="bold" fill="#2E7A50">import / transient</text>
  <text x="640" y="330" font-size="11" fill="#4A4A4A">import 零痕迹</text>
  <text x="640" y="348" font-size="11" fill="#4A4A4A">transient 只有位</text>
  <text x="640" y="366" font-size="10" fill="#8A7F6A">accessFlags.hpp:57</text>

  <rect x="464" y="392" width="312" height="32" rx="8" fill="#FFF6EC" stroke="#E08A3C" stroke-width="1.5"/>
  <text x="480" y="413" font-size="11.5" font-weight="bold" fill="#B06A20">序列化跳过是 Java 层行为（ObjectStreamClass）</text>

  <!-- ==================== 卡片 3（橙）：module ==================== -->
  <rect x="820" y="110" width="320" height="330" rx="14" fill="#FFFFFF" stroke="#E08A3C" stroke-width="2" filter="url(#shadow)"/>
  <rect x="820" y="110" width="7" height="330" rx="3.5" fill="#E08A3C"/>
  <text x="844" y="142" font-size="16" font-weight="bold" fill="#E08A3C">module 系 → Java 层解析</text>
  <text x="844" y="166" font-size="12" fill="#4A4A4A">module-info.class 不是类（ACC_MODULE）</text>

  <rect x="844" y="184" width="272" height="104" rx="9" fill="#FFF6EC" stroke="#E08A3C" stroke-width="1.5"/>
  <text x="860" y="206" font-size="12" font-weight="bold" fill="#B06A20">解析路径（全在 Java 层）</text>
  <text x="860" y="228" font-size="11" fill="#4A4A4A">ModuleDescriptor.read() ← 字节流</text>
  <text x="860" y="246" font-size="11" fill="#4A4A4A">jdk.internal.module.ModuleInfo</text>
  <text x="860" y="264" font-size="11" fill="#4A4A4A">Modules.defineModule()</text>
  <text x="860" y="282" font-size="11" fill="#8A7F6A">→ JVM_DefineModule（jvm.cpp:1316）</text>

  <rect x="844" y="302" width="272" height="66" rx="9" fill="#FFFFFF" stroke="#E08A3C" stroke-width="1.5"/>
  <text x="860" y="324" font-size="12" font-weight="bold" fill="#B06A20">VM 侧：ModuleEntry</text>
  <text x="860" y="344" font-size="11" fill="#4A4A4A">reads 表 · can_read（:125）</text>
  <text x="860" y="362" font-size="11" fill="#4A4A4A">exports/opens → 模块访问控制</text>

  <rect x="844" y="382" width="272" height="42" rx="9" fill="#FFF6EC" stroke="#E08A3C" stroke-width="1.5"/>
  <text x="860" y="402" font-size="11" font-weight="bold" fill="#B06A20">requires/exports/... = 受限关键字</text>
  <text x="860" y="416" font-size="10.5" fill="#8A7F6A">模块声明外可当标识符（JLS §3.9）</text>

  <!-- ==================== 紫条：JDK 28 特别提醒 ==================== -->
  <text x="60" y="478" font-size="16" font-weight="bold" fill="#8E5BB5">JDK 28 特别提醒</text>

  <rect x="60" y="494" width="1080" height="122" rx="12" fill="#FFFFFF" stroke="#8E5BB5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="494" width="7" height="122" rx="3.5" fill="#8E5BB5"/>

  <rect x="88" y="512" width="336" height="86" rx="9" fill="#FAF4FD" stroke="#8E5BB5" stroke-width="1.5"/>
  <text x="104" y="534" font-size="12" font-weight="bold" fill="#6A4B8F">ACC_SUPER → JVM_ACC_IDENTITY</text>
  <text x="104" y="554" font-size="11" fill="#4A4A4A">Valhalla 重定义 0x0020 为 identity 标记</text>
  <text x="104" y="574" font-size="10.5" fill="#8A7F6A">jvm_constants.h:33 · 普通类自动带</text>

  <rect x="438" y="512" width="330" height="86" rx="9" fill="#FAF4FD" stroke="#8E5BB5" stroke-width="1.5"/>
  <text x="454" y="534" font-size="12" font-weight="bold" fill="#6A4B8F">位复用陷阱</text>
  <text x="454" y="554" font-size="11" fill="#4A4A4A">0x0020：类=IDENTITY / 方法=SYNCHRONIZED</text>
  <text x="454" y="574" font-size="11" fill="#4A4A4A">0x0040：字段=VOLATILE / 方法=BRIDGE</text>

  <rect x="782" y="512" width="334" height="86" rx="9" fill="#FAF4FD" stroke="#8E5BB5" stroke-width="1.5"/>
  <text x="798" y="534" font-size="12" font-weight="bold" fill="#6A4B8F">sealed 双重校验</text>
  <text x="798" y="554" font-size="11" fill="#4A4A4A">编译期 javac 拦 + 加载期校验</text>
  <text x="798" y="574" font-size="10.5" fill="#8A7F6A">has_as_permitted_subclass（instanceKlass:282）</text>

  <!-- ==================== 底部：系列收官 ==================== -->
  <text x="60" y="652" font-size="16" font-weight="bold" fill="#E08A3C">系列收官：50 关键字最终分布</text>

  <rect x="60" y="668" width="1080" height="210" rx="12" fill="#FFFFFF" stroke="#E08A3C" stroke-width="2" filter="url(#shadow)"/>

  <rect x="88" y="690" width="190" height="40" rx="7" fill="#FFF6EC" stroke="#E08A3C" stroke-width="1.5"/>
  <text x="183" y="716" text-anchor="middle" font-size="13" font-weight="bold" fill="#B06A20">类别</text>
  <rect x="286" y="690" width="280" height="40" rx="7" fill="#F2F6FC" stroke="#4C6FAF" stroke-width="1.5"/>
  <text x="426" y="716" text-anchor="middle" font-size="13" font-weight="bold" fill="#3D5A99">机制型</text>
  <rect x="574" y="690" width="260" height="40" rx="7" fill="#EEF7F1" stroke="#3E9E6B" stroke-width="1.5"/>
  <text x="704" y="716" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7A50">编译期型</text>
  <rect x="842" y="690" width="276" height="40" rx="7" fill="#FAF4FD" stroke="#8E5BB5" stroke-width="1.5"/>
  <text x="980" y="716" text-anchor="middle" font-size="13" font-weight="bold" fill="#6A4B8F">字面量/受限名</text>

  <text x="100" y="760" font-size="12" fill="#555">代表</text>
  <text x="300" y="760" font-size="12" fill="#444">synchronized/volatile/new/instanceof</text>
  <text x="588" y="760" font-size="12" fill="#444">var/import/assert/strictfp</text>
  <text x="856" y="760" font-size="12" fill="#444">true/false/null/var/yield</text>

  <text x="100" y="790" font-size="12" fill="#555">读什么</text>
  <text x="300" y="790" font-size="12" fill="#444">HotSpot 模板/解析器（行号实证）</text>
  <text x="588" y="790" font-size="12" fill="#444">javac（Gen/Lower/Resolve）</text>
  <text x="856" y="790" font-size="12" fill="#444">JLS + Tokens.java</text>

  <text x="100" y="820" font-size="12" fill="#555">系列篇章</text>
  <text x="300" y="820" font-size="12" fill="#4C6FAF">02-08 机制深读</text>
  <text x="588" y="820" font-size="12" fill="#3E9E6B">09-10 补完篇</text>
  <text x="856" y="820" font-size="12" fill="#8E5BB5">01 全景 + 09 篇内</text>

  <text x="100" y="850" font-size="12" fill="#555">结论</text>
  <text x="300" y="850" font-size="12" fill="#8A7F6A">每个关键字都能回答"行号在哪"</text>
  <text x="588" y="850" font-size="12" fill="#8A7F6A">class 文件零痕迹也是答案</text>
  <text x="856" y="850" font-size="12" fill="#8A7F6A">教科书分类需要修正</text>
</svg>
