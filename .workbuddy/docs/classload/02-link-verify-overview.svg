<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="900" height="600" rx="16" fill="#f6f7fb"/>

  <!-- 标题 -->
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">类加载站② · 链接三阶段全景（parse → verify → link → prepare/resolve）</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#6b7280">classFileParser.cpp · verifier.cpp · instanceKlass.cpp · klassVtable.cpp · JDK 28</text>

  <!-- ================= 层1 解析 parse（蓝） ================= -->
  <rect x="36" y="72" width="828" height="22" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="46" y="87" font-size="11" font-weight="bold" fill="#1d4ed8">关卡① · 解析 parse：验明正身（classFileParser.cpp:6024）</text>

  <rect x="36" y="100" width="176" height="50" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="124" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8" font-family="Consolas,monospace">parse_stream</text>
  <text x="124" y="140" text-anchor="middle" font-size="10.5" fill="#1d4ed8">classFileParser.cpp:6024</text>

  <line x1="212" y1="125" x2="258" y2="125" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ar-blue)"/>

  <rect x="258" y="100" width="186" height="50" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="351" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8" font-family="Consolas,monospace">魔数 0xCAFEBABE</text>
  <text x="351" y="140" text-anchor="middle" font-size="10.5" fill="#1d4ed8">:6034 非法 → ClassFormatError</text>

  <line x1="444" y1="125" x2="490" y2="125" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ar-blue)"/>

  <rect x="490" y="100" width="180" height="50" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="580" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8" font-family="Consolas,monospace">版本校验 :6043</text>
  <text x="580" y="140" text-anchor="middle" font-size="10.5" fill="#1d4ed8">超上限 → UnsupportedClassVersionError</text>

  <line x1="670" y1="125" x2="716" y2="125" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ar-blue)"/>

  <rect x="716" y="100" width="148" height="50" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="790" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8" font-family="Consolas,monospace">常量池 :6058</text>
  <text x="790" y="140" text-anchor="middle" font-size="10.5" fill="#1d4ed8">parse_constant_pool :6064</text>

  <!-- 箭头：层1 → 层2 -->
  <line x1="790" y1="150" x2="790" y2="174" stroke="#8b5cf6" stroke-width="1.6"/>
  <line x1="790" y1="174" x2="450" y2="174" stroke="#8b5cf6" stroke-width="1.4"/>
  <line x1="450" y1="174" x2="450" y2="202" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#ar-purple)"/>
  <text x="620" y="170" text-anchor="middle" font-size="10" fill="#8b5cf6">InstanceKlass 骨架已产出（站①）→ 进入验证</text>

  <!-- ================= 层2 验证 verify（紫） ================= -->
  <rect x="36" y="202" width="828" height="22" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="46" y="217" font-size="11" font-weight="bold" fill="#6d28d9">关卡② · 验证 verify：字节码体检（instanceKlass.cpp:1063 → verifier.cpp:183）</text>

  <rect x="36" y="230" width="260" height="52" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="166" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9" font-family="Consolas,monospace">verify_code :1063</text>
  <text x="166" y="270" text-anchor="middle" font-size="10.5" fill="#6d28d9">link_class_impl :1218 调用</text>

  <line x1="296" y1="256" x2="336" y2="256" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#ar-purple)"/>

  <rect x="336" y="230" width="248" height="52" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="460" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9" font-family="Consolas,monospace">Verifier::verify :183</text>
  <text x="460" y="270" text-anchor="middle" font-size="10.5" fill="#6d28d9">准入检查 is_eligible :136</text>

  <line x1="584" y1="256" x2="624" y2="256" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#ar-purple)"/>

  <rect x="624" y="230" width="240" height="52" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="744" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9" font-family="Consolas,monospace">split verifier :222</text>
  <text x="744" y="270" text-anchor="middle" font-size="10.5" fill="#6d28d9">类型检查 · StackMap · 失败抛 VerifyError</text>

  <!-- 箭头：层2 → 层3 -->
  <line x1="744" y1="282" x2="744" y2="308" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#ar-orange)"/>
  <text x="756" y="300" font-size="10" fill="#b45309">体检通过，接线</text>

  <!-- ================= 层3 链接 link（橙） ================= -->
  <rect x="36" y="308" width="828" height="22" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="46" y="323" font-size="11" font-weight="bold" fill="#b45309">关卡③ · 链接 link：HotSpot 接线工序（instanceKlass.cpp:1123，规范外的独有步骤）</text>

  <rect x="36" y="336" width="192" height="66" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="132" y="356" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309" font-family="Consolas,monospace">先父后己 :1150</text>
  <text x="132" y="374" text-anchor="middle" font-size="9.5" fill="#92400e">父类/接口递归 link</text>
  <text x="132" y="390" text-anchor="middle" font-size="9.5" fill="#92400e">保证 vtable 继承成立</text>

  <line x1="228" y1="369" x2="264" y2="369" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#ar-orange)"/>

  <rect x="264" y="336" width="192" height="66" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="360" y="356" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309" font-family="Consolas,monospace">rewrite :1232</text>
  <text x="360" y="374" text-anchor="middle" font-size="9.5" fill="#92400e">Rewriter :1302 改写字节码</text>
  <text x="360" y="390" text-anchor="middle" font-size="9.5" fill="#92400e">索引 → cpCache（小本本）</text>

  <line x1="456" y1="369" x2="492" y2="369" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#ar-orange)"/>

  <rect x="492" y="336" width="192" height="66" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="588" y="356" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309" font-family="Consolas,monospace">link_methods :1238</text>
  <text x="588" y="374" text-anchor="middle" font-size="9.5" fill="#92400e">Method::link_method :1317</text>
  <text x="588" y="390" text-anchor="middle" font-size="9.5" fill="#92400e">接方法入口（解释器/JIT）</text>

  <line x1="684" y1="369" x2="720" y2="369" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#ar-orange)"/>

  <rect x="720" y="336" width="144" height="66" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="792" y="356" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309" font-family="Consolas,monospace">vtable/itable</text>
  <text x="792" y="374" text-anchor="middle" font-size="9.5" fill="#92400e">klassVtable.cpp:615/:1223</text>
  <text x="792" y="390" text-anchor="middle" font-size="9.5" fill="#92400e">填名册 + 约束检查</text>

  <!-- 完成状态 -->
  <rect x="36" y="408" width="828" height="24" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="450" y="424" text-anchor="middle" font-size="10.5" fill="#b45309">set_init_state(linked) :1271/:1277 → is_linked() = true · JVMTI post_class_prepare :1279</text>

  <!-- 箭头：层3 → 层4 -->
  <line x1="450" y1="432" x2="450" y2="456" stroke="#10b981" stroke-width="1.6" marker-end="url(#ar-green)"/>
  <text x="462" y="450" font-size="10" fill="#047857">已链接，可初始化</text>

  <!-- ================= 层4 准备与解析（绿） ================= -->
  <rect x="36" y="456" width="828" height="22" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
  <text x="46" y="471" font-size="11" font-weight="bold" fill="#047857">关卡④ · 准备 prepare 与解析 resolve（默认值铺好 · 符号懒解析）</text>

  <rect x="36" y="484" width="260" height="58" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="166" y="506" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#047857" font-family="Consolas,monospace">准备：静态字段默认值</text>
  <text x="166" y="524" text-anchor="middle" font-size="9.5" fill="#047857">allocate_instance_klass :522 · static_field_size :5194</text>
  <text x="166" y="537" text-anchor="middle" font-size="9" fill="#047857" opacity="0.85">内存随 InstanceKlass 分配并清零（0/null/false）</text>

  <line x1="296" y1="513" x2="336" y2="513" stroke="#10b981" stroke-width="1.6" marker-end="url(#ar-green)"/>

  <rect x="336" y="484" width="248" height="58" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="460" y="506" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#047857" font-family="Consolas,monospace">解析：懒加载（用才查）</text>
  <text x="460" y="524" text-anchor="middle" font-size="9.5" fill="#047857">类 klass_at_impl :631（常量池站②）</text>
  <text x="460" y="537" text-anchor="middle" font-size="9" fill="#047857" opacity="0.85">方法 resolve_invoke :864 · 结果缓存</text>

  <line x1="584" y1="513" x2="624" y2="513" stroke="#10b981" stroke-width="1.6" marker-end="url(#ar-green)"/>

  <rect x="624" y="484" width="240" height="58" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="744" y="506" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#047857" font-family="Consolas,monospace">为什么懒？</text>
  <text x="744" y="524" text-anchor="middle" font-size="9.5" fill="#047857">可能永远用不到某个符号</text>
  <text x="744" y="537" text-anchor="middle" font-size="9" fill="#047857" opacity="0.85">集中解析 = 慢 + 误报 NoClassDefFoundError</text>

  <!-- 底部：下一站 -->
  <rect x="36" y="560" width="828" height="28" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="450" y="579" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">下一站 · 初始化与卸载：InstanceKlass::initialize :961 → &lt;clinit&gt; 真正赋值（站③）</text>
</svg>
