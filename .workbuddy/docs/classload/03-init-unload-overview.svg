<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="900" height="600" rx="16" fill="#f6f7fb"/>

  <!-- 标题 -->
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">类加载站③ · 初始化与卸载全景（&lt;clinit&gt; 触发 → 并发 → 回收）</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#6b7280">interpreterRuntime.cpp · instanceKlass.cpp · instanceKlass.hpp · classLoaderData.cpp · JDK 28</text>

  <!-- ================= 层1 触发（蓝） ================= -->
  <rect x="36" y="72" width="828" height="22" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="46" y="87" font-size="11" font-weight="bold" fill="#1d4ed8">关卡① · 触发：谁启动 &lt;clinit&gt;（主动使用 → 初始化屏障）</text>

  <rect x="36" y="100" width="196" height="50" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="134" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8" font-family="Consolas,monospace">new 字节码</text>
  <text x="134" y="140" text-anchor="middle" font-size="10.5" fill="#1d4ed8">InterpreterRuntime::_new :223</text>

  <line x1="232" y1="125" x2="278" y2="125" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ar-blue)"/>

  <rect x="278" y="100" width="196" height="50" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="376" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8" font-family="Consolas,monospace">静态字段访问</text>
  <text x="376" y="140" text-anchor="middle" font-size="10.5" fill="#1d4ed8">interpreterRuntime.cpp:741</text>

  <line x1="474" y1="125" x2="520" y2="125" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ar-blue)"/>

  <rect x="520" y="100" width="180" height="50" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="610" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8" font-family="Consolas,monospace">反射/静态方法</text>
  <text x="610" y="140" text-anchor="middle" font-size="10.5" fill="#1d4ed8">forName · newInstance · invoke</text>

  <line x1="700" y1="125" x2="746" y2="125" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ar-blue)"/>

  <rect x="746" y="100" width="118" height="50" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="805" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8" font-family="Consolas,monospace">编译期常量</text>
  <text x="805" y="140" text-anchor="middle" font-size="10" fill="#1d4ed8">不触发（内联）</text>

  <!-- 箭头：层1 → 层2 -->
  <line x1="805" y1="150" x2="805" y2="174" stroke="#8b5cf6" stroke-width="1.6"/>
  <line x1="805" y1="174" x2="450" y2="174" stroke="#8b5cf6" stroke-width="1.4"/>
  <line x1="450" y1="174" x2="450" y2="202" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#ar-purple)"/>
  <text x="630" y="170" text-anchor="middle" font-size="10" fill="#8b5cf6">初始化屏障（:231 initialize_preemptable）→ initialize :961</text>

  <!-- ================= 层2 状态机（紫） ================= -->
  <rect x="36" y="202" width="828" height="22" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="46" y="217" font-size="11" font-weight="bold" fill="#6d28d9">关卡② · 状态机与并发：init_lock 一把锁 + 四态（instanceKlass.cpp:1434-1505）</text>

  <rect x="36" y="230" width="196" height="56" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="134" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6d28d9" font-family="Consolas,monospace">uninitialized</text>
  <text x="134" y="272" text-anchor="middle" font-size="9.5" fill="#6d28d9">还没开始</text>

  <line x1="232" y1="258" x2="278" y2="258" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#ar-purple)"/>

  <rect x="278" y="230" width="196" height="56" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="376" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6d28d9" font-family="Consolas,monospace">being_initialized</text>
  <text x="376" y="272" text-anchor="middle" font-size="9.5" fill="#6d28d9">有人上台 :1498 · 其他人 wait :1450</text>

  <line x1="474" y1="258" x2="520" y2="258" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#ar-purple)"/>

  <rect x="520" y="230" width="180" height="56" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="610" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6d28d9" font-family="Consolas,monospace">fully_initialized</text>
  <text x="610" y="272" text-anchor="middle" font-size="9.5" fill="#6d28d9">完成 · notify_all :1661</text>

  <line x1="700" y1="258" x2="746" y2="258" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#ar-purple)"/>

  <rect x="746" y="230" width="118" height="56" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="805" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9" font-family="Consolas,monospace">init_error</text>
  <text x="805" y="272" text-anchor="middle" font-size="9.5" fill="#6d28d9">失败 · 后续拿同一个错</text>

  <!-- 递归标注 -->
  <rect x="36" y="294" width="828" height="24" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="450" y="310" text-anchor="middle" font-size="10.5" fill="#6d28d9">递归安全：is_reentrant_initialization（instanceKlass.hpp:618）——&lt;clinit&gt; 里 new 自己直接放行 :1461，不死锁</text>

  <!-- 箭头：层2 → 层3 -->
  <line x1="450" y1="318" x2="450" y2="344" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#ar-orange)"/>
  <text x="462" y="336" font-size="10" fill="#b45309">上台成功，念誓词</text>

  <!-- ================= 层3 执行 <clinit>（橙） ================= -->
  <rect x="36" y="344" width="828" height="22" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="46" y="359" font-size="11" font-weight="bold" fill="#b45309">关卡③ · 执行 &lt;clinit&gt;：父类先行 + 誓词上台（instanceKlass.cpp:1536-1620）</text>

  <rect x="36" y="372" width="192" height="60" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="132" y="392" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309" font-family="Consolas,monospace">先初始化父类 :1539</text>
  <text x="132" y="410" text-anchor="middle" font-size="9.5" fill="#92400e">super_klass->initialize</text>
  <text x="132" y="425" text-anchor="middle" font-size="9.5" fill="#92400e">接口 :1546 · 递归</text>

  <line x1="228" y1="402" x2="264" y2="402" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#ar-orange)"/>

  <rect x="264" y="372" width="192" height="60" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="360" y="392" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309" font-family="Consolas,monospace">class_initializer :2010</text>
  <text x="360" y="410" text-anchor="middle" font-size="9.5" fill="#92400e">find_method 找 &lt;clinit&gt;</text>
  <text x="360" y="425" text-anchor="middle" font-size="9.5" fill="#92400e">无则跳过（空实现）</text>

  <line x1="456" y1="402" x2="492" y2="402" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#ar-orange)"/>

  <rect x="492" y="372" width="192" height="60" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="588" y="392" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309" font-family="Consolas,monospace">call_class_initializer</text>
  <text x="588" y="410" text-anchor="middle" font-size="9.5" fill="#92400e">instanceKlass.cpp:2019</text>
  <text x="588" y="425" text-anchor="middle" font-size="9.5" fill="#92400e">JavaCalls::call :2057</text>

  <line x1="684" y1="402" x2="720" y2="402" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#ar-orange)"/>

  <rect x="720" y="372" width="144" height="60" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="792" y="392" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309" font-family="Consolas,monospace">fully_initialized</text>
  <text x="792" y="410" text-anchor="middle" font-size="9.5" fill="#92400e">成功 :1620</text>
  <text x="792" y="425" text-anchor="middle" font-size="9.5" fill="#92400e">notify_all 唤醒</text>

  <!-- 箭头：层3 → 层4 -->
  <line x1="792" y1="432" x2="792" y2="456" stroke="#10b981" stroke-width="1.6" marker-end="url(#ar-green)"/>
  <text x="804" y="450" font-size="10" fill="#047857">失败/卸载</text>

  <!-- ================= 层4 失败与卸载（绿） ================= -->
  <rect x="36" y="456" width="828" height="22" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
  <text x="46" y="471" font-size="11" font-weight="bold" fill="#047857">关卡④ · 失败处理与卸载：错误表 + GC 回收（instanceKlass.cpp:1341 · classLoaderDataGraph.cpp:410）</text>

  <rect x="36" y="484" width="260" height="62" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="166" y="506" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#047857" font-family="Consolas,monospace">失败：错误表 :1341</text>
  <text x="166" y="524" text-anchor="middle" font-size="9.5" fill="#047857">add_initialization_error :1344</text>
  <text x="166" y="539" text-anchor="middle" font-size="9" fill="#047857" opacity="0.85">后续线程拿同一个 cause :1485 → NoClassDefFoundError</text>

  <line x1="296" y1="515" x2="336" y2="515" stroke="#10b981" stroke-width="1.6" marker-end="url(#ar-green)"/>

  <rect x="336" y="484" width="248" height="62" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="460" y="506" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#047857" font-family="Consolas,monospace">卸载：GC 触发</text>
  <text x="460" y="524" text-anchor="middle" font-size="9.5" fill="#047857">do_unloading :410（classLoaderDataGraph.cpp）</text>
  <text x="460" y="539" text-anchor="middle" font-size="9" fill="#047857" opacity="0.85">is_alive 判断 :693</text>

  <line x1="584" y1="515" x2="624" y2="515" stroke="#10b981" stroke-width="1.6" marker-end="url(#ar-green)"/>

  <rect x="624" y="484" width="240" height="62" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="744" y="506" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#047857" font-family="Consolas,monospace">按加载器整批回收</text>
  <text x="744" y="524" text-anchor="middle" font-size="9.5" fill="#047857">ClassLoaderData::unload :604</text>
  <text x="744" y="539" text-anchor="middle" font-size="9" fill="#047857" opacity="0.85">类/方法/常量池 + JVMTI ClassUnload</text>

  <!-- 底部：三站收官 -->
  <rect x="36" y="562" width="828" height="26" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="450" y="580" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">类加载三站收官：站① 加载 → 站② 链接 → 站③ 初始化与卸载——类的一生，源码逐行可查</text>
</svg>
