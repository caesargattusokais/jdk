<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="900" height="600" rx="16" fill="#f6f7fb"/>

  <!-- 标题 -->
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">方法调用全链路 · 第二站：vtable / itable 分派表</text>
  <text x="450" y="58" text-anchor="middle" font-size="12.5" fill="#6b7280">oops/klassVtable.cpp · 构建在链接期（一次），查找在运行期（每次）</text>

  <!-- ================= 内存布局条 ================= -->
  <rect x="30" y="78" width="840" height="84" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="50" y="100" font-size="13" font-weight="bold" fill="#6d28d9">🧱 InstanceKlass 内存布局（元空间）—— vtable 紧跟 Klass 头，itable 紧跟 vtable</text>

  <!-- Klass 头 -->
  <rect x="50" y="112" width="130" height="36" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="115" y="135" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6d28d9">InstanceKlass 头</text>

  <!-- vtable 区 -->
  <rect x="196" y="112" width="330" height="36" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="361" y="126" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1d4ed8">vtable 区（Method* 数组）</text>
  <text x="361" y="141" text-anchor="middle" font-size="10" fill="#3b82f6" font-family="Consolas,monospace">start_of_vtable() = 头 + vtable_start_offset ｜ 每槽 = vtableEntry = 一个 Method*</text>

  <!-- itable 区 -->
  <rect x="542" y="112" width="308" height="36" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="696" y="126" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">itable 区（offset 表 + 方法表）</text>
  <text x="696" y="141" text-anchor="middle" font-size="10" fill="#92400e" font-family="Consolas,monospace">start_of_itable() = vtable 尾 ｜ 头部 offset 表 → 各接口方法区</text>

  <!-- ================= 上半：vtable ================= -->
  <!-- 左：构建 -->
  <rect x="30" y="180" width="410" height="196" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="50" y="204" font-size="13" font-weight="bold" fill="#1d4ed8">🔵 vtable 构建（链接期 · initialize_vtable :161）</text>

  <rect x="46" y="214" width="176" height="52" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="134" y="234" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1d4ed8">① 复制 super 前缀</text>
  <text x="134" y="251" text-anchor="middle" font-size="10" fill="#6b7280">initialize_from_super :132</text>

  <rect x="240" y="214" width="184" height="52" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="332" y="234" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1d4ed8">② 逐方法：覆写 or 追加</text>
  <text x="332" y="251" text-anchor="middle" font-size="10" fill="#6b7280">update_inherited_vtable :382</text>

  <line x1="222" y1="240" x2="238" y2="240" stroke="#3b82f6" stroke-width="1.4" marker-end="url(#ar-blue)"/>

  <rect x="46" y="280" width="184" height="52" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="138" y="300" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1d4ed8">③ 覆写 → 替换同槽</text>
  <text x="138" y="317" text-anchor="middle" font-size="10" fill="#6b7280">put_method_at + set_vtable_index</text>

  <rect x="248" y="280" width="176" height="52" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="336" y="300" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1d4ed8">未覆写 → 追加尾部</text>
  <text x="336" y="317" text-anchor="middle" font-size="10" fill="#6b7280">+ default / miranda 收尾</text>

  <line x1="230" y1="306" x2="246" y2="306" stroke="#3b82f6" stroke-width="1.4" marker-end="url(#ar-blue)"/>

  <text x="50" y="352" font-size="10.5" fill="#1d4ed8" opacity="0.85">不进表：final / private / static / &lt;init&gt;（needs_new_vtable_entry :633）</text>
  <text x="50" y="368" font-size="10.5" fill="#1d4ed8" opacity="0.85">接口方法 → itable；package-private → 自己当根（:678）</text>

  <!-- 右：查找 -->
  <rect x="460" y="180" width="410" height="196" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="480" y="204" font-size="13" font-weight="bold" fill="#6d28d9">🟣 vtable 查找（运行期 · 每次调用）</text>

  <rect x="476" y="216" width="180" height="60" rx="9" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="566" y="238" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6d28d9">method_at_vtable(i)</text>
  <text x="566" y="256" text-anchor="middle" font-size="10" fill="#8b5cf6" font-family="Consolas,monospace">klass.cpp:1118</text>
  <text x="566" y="270" text-anchor="middle" font-size="10" fill="#6b7280">start_of_vtable()[i].method()</text>

  <rect x="676" y="216" width="178" height="60" rx="9" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="765" y="238" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6d28d9">O(1) 数组寻址</text>
  <text x="765" y="256" text-anchor="middle" font-size="10" fill="#8b5cf6" font-family="Consolas,monospace">index 来自缓存</text>
  <text x="765" y="270" text-anchor="middle" font-size="10" fill="#6b7280">linkResolver:1464 衔接</text>

  <line x1="656" y1="246" x2="674" y2="246" stroke="#8b5cf6" stroke-width="1.4" marker-end="url(#ar-purple)"/>

  <rect x="476" y="292" width="378" height="52" rx="9" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="665" y="312" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6d28d9">多态本质：同一槽位，不同接收者 → 不同 Method*</text>
  <text x="665" y="329" text-anchor="middle" font-size="10" fill="#6b7280">子类覆写占同一 index，查表即得"实际类型的那一个"</text>

  <line x1="566" y1="276" x2="566" y2="290" stroke="#8b5cf6" stroke-width="1.4" marker-end="url(#ar-purple)"/>

  <!-- ================= 下半：itable ================= -->
  <!-- 左：构建 -->
  <rect x="30" y="394" width="410" height="186" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="50" y="418" font-size="13" font-weight="bold" fill="#b45309">🟠 itable 构建（链接期）</text>

  <rect x="46" y="428" width="176" height="50" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="134" y="448" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">① 接口方法编号</text>
  <text x="134" y="465" text-anchor="middle" font-size="10" fill="#6b7280">assign_itable_indices :1244</text>

  <rect x="240" y="428" width="184" height="50" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="332" y="448" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">② 找实现填槽</text>
  <text x="332" y="465" text-anchor="middle" font-size="10" fill="#6b7280">lookup_instance_method :1334</text>

  <line x1="222" y1="453" x2="238" y2="453" stroke="#f59e0b" stroke-width="1.4" marker-end="url(#ar-orange)"/>

  <rect x="46" y="492" width="184" height="52" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="138" y="512" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">找到实现 → 填槽</text>
  <text x="138" y="529" text-anchor="middle" font-size="10" fill="#6b7280">initialize(:1355)</text>

  <rect x="248" y="492" width="176" height="52" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="336" y="512" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">空槽 / 非 public</text>
  <text x="336" y="529" text-anchor="middle" font-size="10" fill="#6b7280">留空 → AME ｜ 塞 IAE 抛错方法 :1341</text>

  <line x1="230" y1="518" x2="246" y2="518" stroke="#f59e0b" stroke-width="1.4" marker-end="url(#ar-orange)"/>

  <!-- 右：查找 -->
  <rect x="460" y="394" width="410" height="186" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="480" y="418" font-size="13" font-weight="bold" fill="#047857">🟢 itable 查找（运行期 · 每次 invokeinterface）</text>

  <rect x="476" y="430" width="184" height="58" rx="9" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="568" y="452" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#047857">线性扫描 offset 表</text>
  <text x="568" y="470" text-anchor="middle" font-size="10" fill="#10b981" font-family="Consolas,monospace">method_at_itable_or_null</text>
  <text x="568" y="483" text-anchor="middle" font-size="10" fill="#6b7280">instanceKlass.cpp:3876</text>

  <rect x="680" y="430" width="176" height="58" rx="9" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="768" y="452" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#047857">接口匹配后直取</text>
  <text x="768" y="470" text-anchor="middle" font-size="10" fill="#10b981" font-family="Consolas,monospace">first_method_entry + i</text>
  <text x="768" y="483" text-anchor="middle" font-size="10" fill="#6b7280">空槽 → AME ｜ 未实现 → ICCE</text>

  <line x1="660" y1="459" x2="678" y2="459" stroke="#10b981" stroke-width="1.4" marker-end="url(#ar-green)"/>

  <rect x="476" y="504" width="380" height="48" rx="9" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="666" y="524" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#047857">为什么慢：接口可多继承 → 需先定位接口再查方法</text>
  <text x="666" y="540" text-anchor="middle" font-size="10" fill="#6b7280">C2 用 megamorphic 内联缓存 / 去虚化优化它（后续站）</text>

  <!-- 底部结论 -->
  <text x="450" y="592" text-anchor="middle" font-size="11" fill="#6d28d9">核心认知：vtable 以"类"为单位、O(1) 直达；itable 以"接口"为单位、线性扫描。final/private/static 不进表 → 静态绑定（衔接 08 篇 final 可内联）。</text>
</svg>
